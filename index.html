    return D.items.filter(function (i) { return i.topics.indexOf(key) >= 0; }).length;
  }
  function cardHtml(i) {
    var showEn = i.title_en && i.title_en !== i.title;
    return '<a class="card" href="' + esc(i.link) + '" target="_blank" rel="noopener">' +
      '<div class="t">' + esc(i.title) + '</div>' +
      (showEn ? '<div class="te">' + esc(i.title_en) + '</div>' : '') +
      (i.summary ? '<div class="s">' + esc(i.summary) + '</div>' : '') +
      '<div class="m"><span class="score' + (i.score >= 4 ? '' : ' low') + '">' + i.score + '</span>' +
      '<span>' + esc(i.source) + (i.country ? ' · ' + esc(i.country) : '') +
      (i.date ? ' · ' + esc(i.date) : '') + '</span>' +
      i.topics.map(function (t) { return '<span class="tag">' + esc(NAMES[t] || t) + '</span>'; }).join('') +
      i.chains.map(function (c) { return '<span class="tag chain">' + esc(c) + '</span>'; }).join('') +
      '</div><div class="src">' + esc(i.link) + '</div></a>';
  }

  document.getElementById('meta').innerHTML =
    '最近抓取 ' + esc(D.last_fetch || '—') + '<br>看板生成 ' + esc(D.generated_at);

  document.querySelectorAll('.tab').forEach(function (b) {
    b.onclick = function () {
      state.tab = b.dataset.v;
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('sel', x === b); });
      document.querySelectorAll('.view').forEach(function (v) {
        v.classList.toggle('on', v.id === 'v-' + state.tab); });
    };
  });

  /* 指标卡：主题命中居首，按信息类型分列 */
  var cats = { news: 0, official: 0, thinktank: 0 };
  D.items.forEach(function (i) {
    var c = i.cat || '';
    if (['政府/军方官网', '文档库/出版物', '协会/组织', '活动/会议', '国际组织'].indexOf(c) >= 0) cats.official++;
    else if (c === '智库/研究机构') cats.thinktank++;
    else cats.news++;
  });
  /* 指标卡：主题命中居首；官方文件/智库报告仅计文档库原文，不计动态新闻 */
  var docsArr = D.documents || [];
  var officialN = docsArr.filter(function (d) { return d.type === '官方文件'; }).length;
  var thinkN = docsArr.filter(function (d) { return d.type === '智库报告'; }).length;
  var stats = document.getElementById('stats');
  [['主题命中（累计）', D.items.filter(function (i) { return i.topics.length; }).length, true, null],
   ['动态类信息', D.items.filter(function (i) { return i.topics.length; }).length, false, 'news'],
   ['官方文件类', officialN, false, 'official'],
   ['智库报告类', thinkN, false, 'thinktank']]
    .forEach(function (kv) {
      var el = document.createElement('div');
      el.className = 'stat' + (kv[2] ? ' hot' : '');
      el.style.cursor = 'pointer';
      el.title = kv[3] ? '点击筛选 ' + kv[0] : '点击查看全部主题命中';
      el.innerHTML = '<div class="v">' + kv[1] + '</div><div class="k">' + kv[0] + '</div>';
      el.onclick = function () {
        if (kv[3] === 'official' || kv[3] === 'thinktank') {
          // 官方文件类/智库报告类：进文档库对应类型
          state.docType = kv[3] === 'official' ? '官方文件' : '智库报告';
          document.querySelector('.tab[data-v="docs"]').click();
          renderDocs();
        } else {
          state.catFilter = null;
          state.topic = '__allhits__';
          document.querySelector('.tab[data-v="items"]').click();
          renderChips(); renderAll();
        }
      };
      stats.appendChild(el);
    });

  var bars = document.getElementById('bars');
  var todayN = countOf('__today__');
  var maxCount = Math.max.apply(null, D.topics.map(function (t) { return t.count; }).concat([1, todayN]));
  D.topics.forEach(function (t) {
    if (!t.count) return;
    var g = GROUP[t.name] || 'g-frontier';
    var r = document.createElement('div');
    r.className = 'bar-row';
    r.innerHTML = '<span class="bar-label">' + esc(NAMES[t.name] || t.name) + '</span>' +
      '<span class="bar-track"><span class="bar-fill ' + g + '" style="width:' +
      Math.max(t.count / maxCount * 100, 1.5) + '%"></span></span>' +
      '<span class="bar-num">' + t.count + '</span>';
    r.onclick = function () {
      state.topic = t.name;
      document.querySelector('.tab[data-v="items"]').click();
      renderChips(); renderAll();
    };
    bars.appendChild(r);
  });

  var todayRows = D.items.filter(function (i) { return i.batch === D.today && i.topics.length; })
                         .sort(function (a, b) { return b.score - a.score; });
  document.getElementById('todayNote').textContent = '共 ' + todayRows.length + ' 条，按相关度排序，显示前 6 条';
  document.getElementById('todayCards').innerHTML = todayRows.slice(0, 6).map(cardHtml).join('');

  function renderChips() {
    var chips = document.getElementById('chips');
    chips.innerHTML = '';
    [{ key: '__today__', name: '今日命中' }, { key: '__allhits__', name: '全部命中' }]
      .concat(D.topics.filter(function (t) { return t.count > 0; })
                      .map(function (t) { return { key: t.name, name: NAMES[t.name] || t.name }; }))
      .forEach(function (t) {
        var b = document.createElement('button');
        b.className = 'chip' + (state.topic === t.key ? ' sel' : '');
        b.innerHTML = esc(t.name) + ' <span class="n">' + countOf(t.key) + '</span>';
        b.onclick = function () { state.topic = t.key; renderChips(); renderAll(); };
        chips.appendChild(b);
      });
    // 类型筛选指示（与顶部统计卡联动）
    if (state.catFilter) {
      var bar = document.createElement('span');
      bar.style.cssText = 'font-size:13px;color:#007aff;padding:8px 4px';
      bar.innerHTML = '类型：' + CAT_NAMES[state.catFilter] +
        ' <a href="javascript:void(0)" id="clearCat" style="margin-left:8px;text-decoration:underline">清除</a>';
      chips.appendChild(bar);
      bar.querySelector('#clearCat').onclick = function () {
        state.catFilter = null; renderChips(); renderAll(); };
    }
  }
  function renderAll() {
    var rows;
    if (state.topic === '__today__') rows = todayRows;
    else if (state.topic === '__allhits__') rows = D.items.filter(function (i) {
      // 仅「全部命中」限本周窗口；具体主题展示全部历史
      return i.date >= D.week_start;
    }).slice().reverse();
    else rows = D.items.filter(function (i) { return i.topics.indexOf(state.topic) >= 0; }).slice().reverse();
    if (state.catFilter) {
      rows = rows.filter(function (i) {
        var c = i.cat || '';
        if (state.catFilter === 'thinktank') return c === '智库/研究机构';
        if (state.catFilter === 'official')
          return ['政府/军方官网', '文档库/出版物', '协会/组织', '活动/会议', '国际组织'].indexOf(c) >= 0;
        return ['政府/军方官网', '文档库/出版物', '协会/组织', '活动/会议', '国际组织', '智库/研究机构'].indexOf(c) < 0;
      });
    }
    document.getElementById('allCards').innerHTML =
      rows.map(cardHtml).join('') ||
      '<div class="empty">本周暂无新到条目，随每日抓取自动积累；历史资料请见「资料库」</div>';
  }

  /* 情报产品流水线（日→周→月→季→年） */
  var prod = document.getElementById('pipeline');
  var stages = [
    { icon: '日', name: '每日动态信息', cnt: '日更', meta: ['每日 09:12 批次', '按主题归档资料库'], pending: false },
    { icon: '周', name: '每周热点速递周报', cnt: '待启动', meta: ['沿用智报哨兵规则', '8 篇组版＋逐篇配图'], pending: true },
    { icon: '月', name: '每月防务快讯综述', cnt: (D.products.reviews_count + (D.products.single_list || []).length) + ' 篇',
      meta: ['一期一主题', '网页＋Word 双版本'], pending: false },
    { icon: '季', name: '季度深度报告与智库译丛', cnt: D.products.reports.length ? '在研 ' + D.products.reports.length + ' 份' : '待选题',
      meta: ['双月推荐 ≥2 个主题', '资料库＋文档库支撑'], pending: !D.products.reports.length },
    { icon: '年', name: '年度课题研究报告', cnt: '待立项', meta: ['JADC2 全史研究框架', '及衍生产品'], pending: true }
  ];
  prod.innerHTML = stages.map(function (s) {
    return '<div class="stage' + (s.pending ? ' pending' : '') + '">' +
      '<div class="icon">' + s.icon + '</div><div class="name">' + s.name + '</div>' +
      '<div class="cnt">' + s.cnt + '</div>' +
      '<div class="meta">' + s.meta.join('<br>') + '</div></div>';
  }).join('');

  /* 专题单篇 */
  var singles = D.products.single_list || [];
  function revHtml(r) {
    return '<div class="rev"><a class="rt" href="' + esc(r.url) + '" target="_blank" rel="noopener">' +
      esc(r.title) + '</a><div class="rd"><a href="' + esc(r.url) +
      '" target="_blank" rel="noopener">阅读全文 →</a>' +
      (r.docx ? '　｜　<a href="' + esc(r.docx) + '" style="color:#34c759">下载 Word</a>' : '') +
      '</div></div>';
  }
  document.getElementById('singleList').innerHTML = singles.map(revHtml).join('') ||
    '<div class="empty">专题单篇将随每日精读产出</div>';

  var list = document.getElementById('prodList');
  var reviews = D.products.review_list || [];
  list.innerHTML = reviews.map(revHtml).join('') ||
    '<div class="empty">综述文稿将随每月任务自动生成</div>';

  /* 资料库：全部资料类型统一陈列（动态信息/综述性文章/会议/期刊/官方文件/智库报告） */
  function renderDocs() {
    var chips = document.getElementById('docChips');
    var types = ['全部', '动态信息', '综述性文章', '会议', '期刊', '官方文件', '智库报告'];
    chips.innerHTML = types.map(function (t) {
      return '<button class="chip' + ((state.docType || '全部') === t ? ' sel' : '') +
        '" data-t="' + t + '">' + t + '</button>';
    }).join('');
    chips.querySelectorAll('.chip').forEach(function (b) {
      b.onclick = function () {
        state.docType = b.dataset.t === '全部' ? null : b.dataset.t;
        renderDocs();
      };
    });
    var docCards = document.getElementById('docCards');
    var html = '';
    // 文件类（期刊/官方文件/智库报告/会议）
    var docs = (D.documents || []).filter(function (d) {
      return !state.docType || state.docType === d.type;
    });
    html += docs.map(function (doc) {
      return '<div class="card" style="display:flex;gap:16px">' +
        '<img src="' + esc(doc.cover) + '" alt="封面" style="width:110px;height:150px;object-fit:cover;border:1px solid #e5e7ec;border-radius:6px;flex:none">' +
        '<div style="flex:1;min-width:0">' +
        '<div class="t">' + esc(doc.title_cn) + '</div>' +
        '<div class="te">' + esc(doc.title) + '</div>' +
        '<div class="m"><span class="tag chain">' + esc(doc.type) + '</span>' +
        '<span>' + esc(doc.org) + ' · ' + esc(doc.date) + ' · ' + doc.pages + ' 页</span></div>' +
        '<div class="s">' + esc(doc.summary) + '</div>' +
        '<div class="m"><a href="' + esc(doc.file) + '" style="color:#34c759;text-decoration:none;font-weight:600">下载 PDF ↓</a>' +
        '　<a href="' + esc(doc.url) + '" target="_blank" rel="noopener" style="color:#007aff;text-decoration:none">原文页 →</a></div>' +
        '</div></div>';
    }).join('');
    // 动态与综述性文章（条目库）
    if (!state.docType || state.docType === '动态信息' || state.docType === '综述性文章') {
      var rows = D.items.filter(function (i) {
        var k = i.kind || '动态信息';
        return !state.docType || k === state.docType;
      }).slice().reverse();
      html += rows.map(cardHtml).join('');
    }
    docCards.innerHTML = html || '<div class="empty">资料库持续积累：动态信息、综述性文章、会议文件、期刊、官方文件、智库报告</div>';
  }

  renderChips();
  renderAll();

  var mainEl = document.querySelector('main');
  var toTop = document.getElementById('toTop');
  mainEl.addEventListener('scroll', function () {
    toTop.style.display = mainEl.scrollTop > 300 ? 'block' : 'none';
  });
  if (toTop) toTop.onclick = function () { mainEl.scrollTo({ top: 0, behavior: 'smooth' }); };
})();
</script>
</body>
</html>
