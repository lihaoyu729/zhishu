  }
  var prod = document.getElementById('prod');
  [['双周综述', '已出 ' + D.products.reviews_count + ' 篇', '下一期 ' + D.products.next_review_due],
   ['深度报告', D.products.reports.length ? '在研 ' + D.products.reports.length + ' 份' : '待选题',
    '选题由双月推荐产生'],
   ['双月选题推荐', '已出 ' + D.products.recs_count + ' 期', '下一期 ' + D.products.next_rec_due]]
    .forEach(function (kv) {
      var el = document.createElement('div');
      el.className = 'cell';
      el.innerHTML = '<div class="k">' + kv[0] + '</div><div class="v">' +
        esc(kv[1]) + '</div><div class="d">' + kv[2] + '</div>';
      prod.appendChild(el);
    });
  var latest = D.products.reports.length ? D.products.reports : ['综述-2026年第1期-外军无人自主系统建设运用（已按防务快讯版式）'];
  document.getElementById('prodList').innerHTML = latest.map(function (f) {
    return '· ' + esc(f.replace(/\.md$/, '')); }).join('<br>');
  renderChips();
  renderAll();
})();
</script>
</body>
